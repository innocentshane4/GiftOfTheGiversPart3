trigger:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '8.x'

  - script: dotnet restore
    displayName: 'Restore NuGet Packages'

  - script: dotnet build --configuration $(buildConfiguration) --no-restore
    displayName: 'Build Solution'

  - script: dotnet test --configuration $(buildConfiguration) --no-build --logger "trx;LogFileName=TestResults.trx" --results-directory "$(Agent.TempDirectory)/TestResults"
    displayName: 'Run Automated Tests'
    continueOnError: false

  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Agent.TempDirectory)/TestResults'
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: 'Gift of the Givers Protect - Automated Tests'